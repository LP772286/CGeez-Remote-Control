name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the project
        run: |
          ZIP="$(find . -maxdepth 1 -iname '*.zip' | head -n1)"
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            unzip -q -o "$ZIP" -d src
            chmod -R u+rwX src
            SETTINGS="$(find src -name settings.gradle.kts | head -n1)"
          else
            echo "No zip, using repo files"
            SETTINGS="$(find . -name settings.gradle.kts -not -path './src/*' | head -n1)"
          fi
          echo "PROJECT=$(dirname "$SETTINGS")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          cd "$PROJECT"
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CGeez-RC.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CGeez-RC-apk
          path: CGeez-RC.apk